# 文序 · md2articlehtml —— Nginx 子路径静态部署配置
#
# 用法：把下面两个 location 放进主域名现有的 server {} 内，
# 不要替换整份 nginx.conf，也不要改动主站的 location /。
#
# 关键：本应用不能工作在站点上层的 `Content-Security-Policy: default-src 'self'` 之下，
# 必须在 location 内显式覆盖 CSP。详见文件末尾的说明。

location = /md2articlehtml {
    return 301 /md2articlehtml/$is_args$args;
}

location ^~ /md2articlehtml/ {
    root /home/project/www;
    index index.html;
    try_files $uri $uri/ =404;

    # ------------------------------------------------------------------
    # 内容安全策略（必须覆盖站点上层配置）
    #
    # 站点上层若下发 `default-src 'self'`，以下三项能力会同时失效：
    #   1. script-src：dist/client/index.html 中的内联 RSC 水合脚本被拦截，
    #      客户端拿不到水合载荷，页面只剩静态 HTML，交互全部失效并报脚本错误。
    #   2. style-src：内联 style 属性被拦截，主题与预览样式错乱。
    #   3. img-src / connect-src：Markdown 里的外链图片无法加载，
    #      自定义图床上传接口无法调用。
    #
    # 因此这里逐项放开本应用必需的能力，其余仍收紧。
    # 需要的指令说明：
    #   script-src  'unsafe-inline'  Vinext 渲染器输出的内联水合脚本（无法避免）
    #   style-src   'unsafe-inline'  组件输出的内联 style 属性
    #   img-src     data: blob: https:  用户 Markdown 外链图与本地粘贴图
    #   connect-src https:              自定义图床上传接口
    # ------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    # nginx 的 add_header 一旦在当前层级出现，就不再继承上层的同名指令，
    # 所以上层原有的安全响应头需要在这里重新声明，避免覆盖后丢失。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control "no-cache" always;
}

# ======================================================================
# 覆盖不生效时的排查
# ======================================================================
#
# 1. 先确认上层 CSP 是用哪种指令下发的：
#
#       sudo grep -rn "Content-Security-Policy" /etc/nginx/
#
# 2. 如果是 `add_header`：上面的 location 内覆盖即可生效（add_header 不跨层继承）。
#
# 3. 如果是 `more_set_headers`（headers-more 模块）：它在 header filter 阶段
#    执行，会覆盖 add_header 的结果。这种情况要在 location 内同样使用
#    more_set_headers，例如：
#
#       more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'";
#
# 4. 如果站点前面还有 CDN、宝塔面板或反向代理，它们也会下发 CSP，
#    需要在那一层同步放宽，否则浏览器仍会拦截。
#
# 5. 验证（期望看到新的 CSP，而不是 default-src 'self'）：
#
#       curl -I http://服务器IP:81/md2articlehtml/
#
#    浏览器控制台不应再出现
#    “Refused to execute inline script because it violates the following
#     Content Security Policy directive” 之类的报错。
